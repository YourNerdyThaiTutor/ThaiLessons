<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Tone Master</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="w-full bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <a href="https://yournerdythaitutor.github.io/Lessons/" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow">
            ← Study Thai
        </a>
        <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent hidden sm:block">Thai Tone Practice</h1>
        <button onclick="openStats()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow flex items-center gap-2 cursor-pointer">
            📊 Stats (<span id="total-played-count">0</span>)
        </button>
    </header>

    <!-- Main Game Container -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center items-center">
        
        <!-- Game Card -->
        <div class="w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl flex flex-col items-center relative overflow-hidden">
            
            <!-- Progress / Score badge -->
            <div class="w-full flex justify-between items-center mb-4 text-xs font-semibold text-slate-400 tracking-wider uppercase">
                <span>Streak: <span id="current-streak" class="text-emerald-400 font-bold text-sm">0</span></span>
                <span id="word-category" class="bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">Loading...</span>
            </div>

            <!-- Audio Player Trigger -->
            <button onclick="playAudio()" class="w-16 h-16 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition rounded-full flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-4 group cursor-pointer">
                <svg class="w-8 h-8 text-white group-hover:scale-110 transition" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
            <p class="text-[11px] text-slate-400 mb-6 animate-pulse">Tap speaker to listen</p>

            <!-- Target Word Character/Syllable Selector -->
            <div class="w-full mb-6">
                <p class="text-xs uppercase tracking-widest text-slate-400 mb-2 text-center">Tap a block to add/change tone:</p>
                <div id="character-selector-container" class="flex flex-wrap justify-center gap-2 bg-slate-900/80 border border-slate-700/60 rounded-2xl p-4 min-h-[5.5rem] items-center">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- Tone Modification Keypad -->
            <div class="grid grid-cols-4 gap-2 w-full mb-3">
                <button onclick="applyToneToSelected('̀')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-100 py-3 rounded-xl font-bold text-lg shadow transition flex flex-col items-center justify-center cursor-pointer">
                    <span>◌่</span>
                    <span class="text-[9px] font-normal text-slate-400 mt-0.5">Low</span>
                </button>
                <button onclick="applyToneToSelected('́')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-100 py-3 rounded-xl font-bold text-lg shadow transition flex flex-col items-center justify-center cursor-pointer">
                    <span>◌́</span>
                    <span class="text-[9px] font-normal text-slate-400 mt-0.5">High</span>
                </button>
                <button onclick="applyToneToSelected('̂')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-100 py-3 rounded-xl font-bold text-lg shadow transition flex flex-col items-center justify-center cursor-pointer">
                    <span>◌̂</span>
                    <span class="text-[9px] font-normal text-slate-400 mt-0.5">Falling</span>
                </button>
                <button onclick="applyToneToSelected('̌')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-100 py-3 rounded-xl font-bold text-lg shadow transition flex flex-col items-center justify-center cursor-pointer">
                    <span>◌̌</span>
                    <span class="text-[9px] font-normal text-slate-400 mt-0.5">Rising</span>
                </button>
            </div>

            <!-- Remove Mark Button -->
            <button onclick="applyToneToSelected('')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 py-2.5 rounded-xl font-semibold text-xs tracking-wider uppercase mb-6 shadow transition cursor-pointer">
                Remove Mark
            </button>

            <!-- Action Submit / Next Button -->
            <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/20 transition cursor-pointer">
                Check Answer
            </button>

            <!-- Feedback banner -->
            <div id="feedback-banner" class="mt-4 text-center font-semibold text-sm hidden"></div>

        </div>
    </main>

    <!-- Stats Modal -->
    <div id="stats-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <h2 class="text-xl font-bold text-indigo-300">📊 Vocabulary Performance</h2>
                <button onclick="closeStats()" class="text-slate-400 hover:text-white font-bold text-lg px-2 cursor-pointer">✕</button>
            </div>
            <p class="text-xs text-slate-400 mb-4">Words are sorted with your worst-performing items at the top so you can focus your practice.</p>
            <div id="stats-list" class="overflow-y-auto flex-1 divide-y divide-slate-700/50 pr-1">
                <!-- Populated via JS -->
            </div>
            <button onclick="closeStats()" class="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl transition cursor-pointer">Close</button>
        </div>
    </div>

    <!-- External Script Load -->
    <script src="./assets/vocabAudioUrls.js"></script>

    <script>
        // Fallback dataset if external script is missing
        let rawUrls = typeof vocabAudioUrls !== 'undefined' ? vocabAudioUrls : `
            https://yournerdythaitutor.github.io/Lessons/audios/directions/สุขา.mp3
            https://yournerdythaitutor.github.io/Lessons/audios/directions/รถไฟฟ้า.mp3
            https://yournerdythaitutor.github.io/Lessons/audios/directions/ทาง.mp3
        `;

        let vocabulary = [];
        
        function parseUrls() {
            let lines = [];
            if (typeof rawUrls === 'string') {
                lines = rawUrls.split(/[\r\n]+/).map(l => l.trim()).filter(l => l.startsWith('http'));
            } else if (Array.isArray(rawUrls)) {
                lines = rawUrls;
            }

            vocabulary = lines.map(url => {
                const parts = url.split('/');
                const filenameWithExt = parts[parts.length - 1] || '';
                const word = decodeURIComponent(filenameWithExt.replace('.mp3', ''));
                const category = parts[parts.length - 2] || 'general';
                const stripped = stripThaiTones(word);
                return { url, word, stripped, category };
            }).filter(item => item.word.length > 0);
        }

        function stripThaiTones(text) {
            return text.replace(/[\u0E48-\u0E4B\u0E4C]/g, '');
        }

        // Smart tokenizer to group consonants with leading/trailing vowels and dependent signs correctly
        function tokenizeThaiWord(word) {
            let chars = Array.from(word);
            let blocks = [];
            let currentBlock = "";

            // Thai leading vowels (เ, แ, โ, ใ, ไ) should attach to the upcoming consonant
            let leadingVowels = new Set(['เ', 'แ', 'โ', 'ใ', 'ไ']);

            for (let i = 0; i < chars.length; i++) {
                let char = chars[i];
                
                // If it's a leading vowel and we have a pending block, push the old one first
                if (leadingVowels.has(char) && currentBlock !== "") {
                    blocks.push(currentBlock);
                    currentBlock = char;
                } else if (currentBlock === "" || !leadingVowels.has(currentBlock[0])) {
                    // Normal combination building
                    // If current character is a dependent vowel or sign (e.g. ะ, า, ิ, ี, ึ, ื, ุ, ู, ็, ์, etc.) attach to current block
                    const isDependent = /[\u0E30-\u0E3A\u0E47-\u0E4E]/.test(char);
                    if (isDependent && currentBlock !== "") {
                        currentBlock += char;
                    } else if (currentBlock !== "" && leadingVowels.has(currentBlock)) {
                        // If current block started with a leading vowel, attach this consonant/vowel to it
                        currentBlock += char;
                        blocks.push(currentBlock);
                        currentBlock = "";
                    } else {
                        if (currentBlock !== "") {
                            blocks.push(currentBlock);
                        }
                        currentBlock = char;
                    }
                } else {
                    currentBlock += char;
                }
            }
            if (currentBlock !== "") {
                blocks.push(currentBlock);
            }

            // Fallback if empty
            if (blocks.length === 0) blocks = chars;

            return blocks;
        }

        let currentWordObj = null;
        let userBlocks = []; // Array of { text: 'ส', tone: '' }
        let selectedIndex = 0;
        let currentAudio = null;
        let currentStreak = parseInt(localStorage.getItem('thai_game_streak') || '0');
        document.getElementById('current-streak').innerText = currentStreak;

        function initGame() {
            parseUrls();
            if (vocabulary.length === 0) {
                document.getElementById('character-selector-container').innerHTML = `<p class="text-rose-400 text-sm">No audio URLs found in vocabAudioUrls.js!</p>`;
                return;
            }
            loadRandomWord();
        }

        function loadRandomWord() {
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            
            let weightedPool = [];
            vocabulary.forEach(item => {
                let stat = stats[item.word];
                let weight = 3;
                if (stat && stat.total > 0) {
                    let accuracy = stat.correct / stat.total;
                    if (accuracy < 0.4) weight = 8;
                    else if (accuracy < 0.7) weight = 5;
                    else weight = 1;
                }
                for (let i = 0; i < weight; i++) {
                    weightedPool.push(item);
                }
            });

            currentWordObj = weightedPool[Math.floor(Math.random() * weightedPool.length)];
            
            // Tokenize stripped word into correct syllable/character blocks
            const strippedWord = currentWordObj.stripped;
            const tokens = tokenizeThaiWord(strippedWord);
            
            userBlocks = tokens.map(t => ({ text: t, tone: '' }));
            selectedIndex = 0;
            
            document.getElementById('word-category').innerText = currentWordObj.category;
            renderCharacterSelector();

            let banner = document.getElementById('feedback-banner');
            banner.classList.add('hidden');
            let submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Check Answer";
            submitBtn.setAttribute("onclick", "checkAnswer()");
            submitBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/20 transition cursor-pointer";

            playAudio();
            updateStatsCounter();
        }

        function renderCharacterSelector() {
            const container = document.getElementById('character-selector-container');
            container.innerHTML = '';

            userBlocks.forEach((item, index) => {
                const isSelected = index === selectedIndex;
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `relative px-3.5 py-2.5 rounded-xl text-3xl font-semibold transition flex flex-col items-center justify-center cursor-pointer ${
                    isSelected ? 'bg-slate-800 text-sky-400 shadow-md ring-1 ring-sky-500/50' : 'bg-slate-900/40 text-slate-200 hover:bg-slate-800/60'
                }`;
                
                // Display block text + tone mark combined
                btn.innerHTML = `
                    <span>${item.text}${item.tone}</span>
                    <div class="absolute bottom-1 w-3/4 h-1 rounded-full ${isSelected ? 'bg-sky-400' : 'bg-transparent'}"></div>
                `;
                btn.onclick = () => {
                    selectedIndex = index;
                    renderCharacterSelector();
                };
                container.appendChild(btn);
            });
        }

        function applyToneToSelected(toneMark) {
            if (userBlocks.length === 0) return;
            userBlocks[selectedIndex].tone = toneMark;
            renderCharacterSelector();
        }

        function playAudio() {
            if (!currentWordObj) return;
            if (currentAudio) {
                currentAudio.pause();
            }
            currentAudio = new Audio(currentWordObj.url);
            currentAudio.play().catch(e => console.log("Audio play blocked:", e));
        }

        function recordResult(word, isCorrect) {
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            if (!stats[word]) {
                stats[word] = { correct: 0, total: 0, category: currentWordObj.category };
            }
            stats[word].total += 1;
            if (isCorrect) {
                stats[word].correct += 1;
            }
            localStorage.setItem('thai_vocab_stats', JSON.stringify(stats));
        }

        function checkAnswer() {
            if (!currentWordObj) return;
            
            // Build full user attempt string
            const fullAttempt = userBlocks.map(item => item.text + item.tone).join('');
            const isCorrect = fullAttempt === currentWordObj.word;
            
            recordResult(currentWordObj.word, isCorrect);

            let banner = document.getElementById('feedback-banner');
            banner.classList.remove('hidden');

            if (isCorrect) {
                currentStreak++;
                localStorage.setItem('thai_game_streak', currentStreak);
                document.getElementById('current-streak').innerText = currentStreak;

                banner.className = "mt-4 text-center font-bold text-emerald-400 text-base animate-bounce";
                banner.innerText = "🎉 Correct! Great job!";
            } else {
                currentStreak = 0;
                localStorage.setItem('thai_game_streak', currentStreak);
                document.getElementById('current-streak').innerText = currentStreak;

                banner.className = "mt-4 text-center font-bold text-rose-400 text-sm";
                banner.innerHTML = `❌ Incorrect. Correct word was: <span class="text-white text-base">${currentWordObj.word}</span>`;
            }

            let submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Next Word ➔";
            submitBtn.setAttribute("onclick", "loadRandomWord()");
            submitBtn.className = "w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-500/20 transition cursor-pointer";
            
            updateStatsCounter();
        }

        function updateStatsCounter() {
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            let totalAnswers = Object.values(stats).reduce((acc, curr) => acc + curr.total, 0);
            document.getElementById('total-played-count').innerText = totalAnswers;
        }

        function openStats() {
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            let listEl = document.getElementById('stats-list');
            listEl.innerHTML = '';

            let items = vocabulary.map(v => {
                let s = stats[v.word] || { correct: 0, total: 0, category: v.category };
                let pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : -1;
                return { word: v.word, category: v.category, correct: s.correct, total: s.total, pct };
            });

            // Sort: Worst performing percentage first
            items.sort((a, b) => {
                if (a.pct === -1 && b.pct === -1) return 0;
                if (a.pct === -1) return 1;
                if (b.pct === -1) return -1;
                return a.pct - b.pct;
            });

            if (items.length === 0 || items.every(i => i.total === 0)) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-8">No practice stats recorded yet. Play a few rounds!</p>`;
            } else {
                items.forEach(item => {
                    let pctText = item.total > 0 ? `${item.pct}%` : 'Unplayed';
                    let colorClass = item.total === 0 ? 'text-slate-400' : item.pct < 50 ? 'text-rose-400' : item.pct < 80 ? 'text-amber-400' : 'text-emerald-400';
                    
                    let div = document.createElement('div');
                    div.className = "py-3 flex justify-between items-center text-sm";
                    div.innerHTML = `
                        <div>
                            <span class="font-bold text-white text-base">${item.word}</span>
                            <span class="block text-xs text-slate-400">${item.category}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold ${colorClass}">${pctText}</span>
                            <span class="block text-xs text-slate-500">${item.correct}/${item.total} correct</span>
                        </div>
                    `;
                    listEl.appendChild(div);
                });
            }

            document.getElementById('stats-modal').classList.remove('hidden');
        }

        function closeStats() {
            document.getElementById('stats-modal').classList.add('hidden');
        }

        window.onload = initGame;
    </script>
</body>
</html>
