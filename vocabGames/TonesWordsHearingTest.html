<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Tone Practice Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap');
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="w-full bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <a href="https://yournerdythaitutor.github.io/Lessons/" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow">
            ← Study Thai
        </a>
        <h1 class="text-lg font-bold bg-gradient-to-r from-indigo-400 to-pink-400 bg-clip-text text-transparent hidden sm:block">Thai Tone Master</h1>
        <button onclick="openStats()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow flex items-center gap-2">
            📊 Stats (<span id="total-played-count">0</span>)
        </button>
    </header>

    <!-- Main Game Container -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center items-center">
        
        <!-- Game Card -->
        <div class="w-full bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl flex flex-col items-center relative overflow-hidden">
            
            <!-- Progress / Score badge -->
            <div class="w-full flex justify-between items-center mb-6 text-xs font-semibold text-slate-400 tracking-wider uppercase">
                <span>Streak: <span id="current-streak" class="text-emerald-400 font-bold text-sm">0</span></span>
                <span id="word-category" class="bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">Loading...</span>
            </div>

            <!-- Audio Player Trigger -->
            <button onclick="playAudio()" class="w-20 h-20 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition rounded-full flex items-center justify-center shadow-lg shadow-indigo-500/30 mb-6 group cursor-pointer">
                <svg class="w-9 h-9 text-white group-hover:scale-110 transition" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
            <p class="text-xs text-slate-400 mb-6 animate-pulse">Tap speaker to listen</p>

            <!-- Target Word Display (Stripped of Tones) -->
            <div class="text-center mb-6 w-full">
                <p class="text-xs uppercase tracking-widest text-slate-400 mb-1">Target Word (Add Tones):</p>
                <div id="stripped-word-display" class="text-4xl font-bold tracking-wide text-indigo-200 min-h-[3rem] flex items-center justify-center bg-slate-900/50 rounded-2xl border border-slate-700/50 p-3">
                    ...
                </div>
            </div>

            <!-- Tone Modification Buttons -->
            <div class="grid grid-cols-5 gap-2 w-full mb-6">
                <button onclick="addTone('̀')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-200 py-3 rounded-xl font-bold text-lg shadow transition">่<span class="block text-[10px] font-normal text-slate-400">Low</span></button>
                <button onclick="addTone('́')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-200 py-3 rounded-xl font-bold text-lg shadow transition">́<span class="block text-[10px] font-normal text-slate-400">High</span></button>
                <button onclick="addTone('̂')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-200 py-3 rounded-xl font-bold text-lg shadow transition">̂<span class="block text-[10px] font-normal text-slate-400">Falling</span></button>
                <button onclick="addTone('̌')" class="bg-slate-700 hover:bg-slate-600 active:bg-indigo-600 text-slate-200 py-3 rounded-xl font-bold text-lg shadow transition">̌<span class="block text-[10px] font-normal text-slate-400">Rising</span></button>
                <button onclick="removeLastTone()" class="bg-rose-900/40 hover:bg-rose-900/60 text-rose-300 border border-rose-700/50 py-3 rounded-xl font-bold text-xs shadow transition flex flex-col items-center justify-center">⌫<span class="block text-[10px] font-normal text-rose-400 mt-0.5">Clear</span></button>
            </div>

            <!-- User's Current Attempt Input Display -->
            <div class="w-full mb-6">
                <div id="user-attempt-display" class="w-full bg-slate-900 border border-slate-700 rounded-2xl py-3 text-center text-2xl font-bold text-white min-h-[3.5rem] flex items-center justify-center tracking-wide">
                </div>
            </div>

            <!-- Action Submit / Next Button -->
            <button id="submit-btn" onclick="checkAnswer()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/20 transition cursor-pointer">
                Check Answer
            </button>

            <!-- Feedback banner -->
            <div id="feedback-banner" class="mt-4 text-center font-semibold text-sm hidden"></div>

        </div>
    </main>

    <!-- Stats Modal -->
    <div id="stats-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-700">
                <h2 class="text-xl font-bold text-indigo-300">📊 Vocabulary Performance</h2>
                <button onclick="closeStats()" class="text-slate-400 hover:text-white font-bold text-lg px-2">✕</button>
            </div>
            <p class="text-xs text-slate-400 mb-4">Words are sorted with your worst-performing items at the top so you can focus your practice.</p>
            <div id="stats-list" class="overflow-y-auto flex-1 divide-y divide-slate-700/50 pr-1">
                <!-- Populated via JS -->
            </div>
            <button onclick="closeStats()" class="mt-4 w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl transition">Close</button>
        </div>
    </div>

    <!-- External Script Load -->
    <script src="./assets/vocabAudioUrls.js"></script>

    <script>
        // Fallback dataset if external script fails or isn't loaded
        let rawUrls = typeof vocabAudioUrls !== 'undefined' ? vocabAudioUrls : `
            https://yournerdythaitutor.github.io/Lessons/audios/directions/สุขา.mp3
            https://yournerdythaitutor.github.io/Lessons/audios/directions/รถไฟฟ้า.mp3
            https://yournerdythaitutor.github.io/Lessons/audios/directions/ทาง.mp3
        `;

        // Clean & parse URLs into structured objects
        let vocabulary = [];
        
        function parseUrls() {
            let lines = [];
            if (typeof rawUrls === 'string') {
                lines = rawUrls.split(/[\r\n]+/).map(l => l.trim()).filter(l => l.startsWith('http'));
            } else if (Array.isArray(rawUrls)) {
                lines = rawUrls;
            }

            vocabulary = lines.map(url => {
                const parts = url.split('/');
                const filenameWithExt = parts[parts.length - 1] || '';
                const word = decodeURIComponent(filenameWithExt.replace('.mp3', ''));
                const category = parts[parts.length - 2] || 'general';
                const stripped = stripThaiTones(word);
                return { url, word, stripped, category };
            }).filter(item => item.word.length > 0);
        }

        // Strip Thai tone marks (Mai Ek, Mai Tho, Mai Tri, Mai Chaturta, Karan, etc.)
        function stripThaiTones(text) {
            // Unicode ranges for Thai tone marks and vowels/diacritics if necessary, specifically tones: \u0E48-\u0E4B
            return text.replace(/[\u0E48-\u0E4B\u0E4C]/g, '');
        }

        let currentWordObj = null;
        let currentInput = '';
        let currentAudio = null;
        let currentStreak = parseInt(localStorage.getItem('thai_game_streak') || '0');
        document.getElementById('current-streak').innerText = currentStreak;

        function initGame() {
            parseUrls();
            if (vocabulary.length === 0) {
                document.getElementById('stripped-word-display').innerText = "No audio URLs found!";
                return;
            }
            loadRandomWord();
        }

        function loadRandomWord() {
            // Weighted selection favoring worse performing words stored in localStorage
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            
            let weightedPool = [];
            vocabulary.forEach(item => {
                let stat = stats[item.word];
                let weight = 3; // default weight for unplayed words
                if (stat && stat.total > 0) {
                    let accuracy = stat.correct / stat.total;
                    if (accuracy < 0.4) weight = 8;
                    else if (accuracy < 0.7) weight = 5;
                    else weight = 1;
                }
                for (let i = 0; i < weight; i++) {
                    weightedPool.push(item);
                }
            });

            currentWordObj = weightedPool[Math.floor(Math.random() * weightedPool.length)];
            currentInput = currentWordObj.stripped;
            
            document.getElementById('word-category').innerText = currentWordObj.category;
            document.getElementById('stripped-word-display').innerText = currentWordObj.stripped;
            updateAttemptDisplay();

            // Reset UI states
            let banner = document.getElementById('feedback-banner');
            banner.classList.add('hidden');
            let submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Check Answer";
            submitBtn.setAttribute("onclick", "checkAnswer()");
            submitBtn.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-600/20 transition cursor-pointer";

            playAudio();
            updateStatsCounter();
        }

        function playAudio() {
            if (!currentWordObj) return;
            if (currentAudio) {
                currentAudio.pause();
            }
            currentAudio = new Audio(currentWordObj.url);
            currentAudio.play().catch(e => console.log("Audio play blocked or missing:", e));
        }

        function addTone(toneChar) {
            currentInput += toneChar;
            updateAttemptDisplay();
        }

        function removeLastTone() {
            if (currentInput.length > 0) {
                currentInput = currentInput.slice(0, -1);
                updateAttemptDisplay();
            }
        }

        function updateAttemptDisplay() {
            document.getElementById('user-attempt-display').innerText = currentInput;
        }

        function recordResult(word, isCorrect) {
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            if (!stats[word]) {
                stats[word] = { correct: 0, total: 0, category: currentWordObj.category };
            }
            stats[word].total += 1;
            if (isCorrect) {
                stats[word].correct += 1;
            }
            localStorage.setItem('thai_vocab_stats', JSON.stringify(stats));
        }

        function checkAnswer() {
            if (!currentWordObj) return;
            
            const isCorrect = currentInput === currentWordObj.word;
            recordResult(currentWordObj.word, isCorrect);

            let banner = document.getElementById('feedback-banner');
            banner.classList.remove('hidden');

            if (isCorrect) {
                currentStreak++;
                localStorage.setItem('thai_game_streak', currentStreak);
                document.getElementById('current-streak').innerText = currentStreak;

                banner.className = "mt-4 text-center font-bold text-emerald-400 text-base animate-bounce";
                banner.innerText = "🎉 Correct! Great job!";
            } else {
                currentStreak = 0;
                localStorage.setItem('thai_game_streak', currentStreak);
                document.getElementById('current-streak').innerText = currentStreak;

                banner.className = "mt-4 text-center font-bold text-rose-400 text-sm";
                banner.innerHTML = `❌ Incorrect. Correct word was: <span class="text-white text-base">${currentWordObj.word}</span>`;
            }

            let submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Next Word ➔";
            submitBtn.setAttribute("onclick", "loadRandomWord()");
            submitBtn.className = "w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-500/20 transition cursor-pointer";
            
            updateStatsCounter();
        }

        function updateStatsCounter() {
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            let totalAnswers = Object.values(stats).reduce((acc, curr) => acc + curr.total, 0);
            document.getElementById('total-played-count').innerText = totalAnswers;
        }

        function openStats() {
            let stats = JSON.parse(localStorage.getItem('thai_vocab_stats') || '{}');
            let listEl = document.getElementById('stats-list');
            listEl.innerHTML = '';

            let items = vocabulary.map(v => {
                let s = stats[v.word] || { correct: 0, total: 0, category: v.category };
                let pct = s.total > 0 ? Math.round((s.correct / s.total) * 100) : -1;
                return { word: v.word, category: v.category, correct: s.correct, total: s.total, pct };
            });

            // Sort: Worst performing percentage first. Unplayed items or 0% at top.
            items.sort((a, b) => {
                if (a.pct === -1 && b.pct === -1) return 0;
                if (a.pct === -1) return 1;
                if (b.pct === -1) return -1;
                return a.pct - b.pct;
            });

            if (items.length === 0 || items.every(i => i.total === 0)) {
                listEl.innerHTML = `<p class="text-center text-slate-400 py-8">No practice stats recorded yet. Play a few rounds!</p>`;
            } else {
                items.forEach(item => {
                    let pctText = item.total > 0 ? `${item.pct}%` : 'Unplayed';
                    let colorClass = item.total === 0 ? 'text-slate-400' : item.pct < 50 ? 'text-rose-400' : item.pct < 80 ? 'text-amber-400' : 'text-emerald-400';
                    
                    let div = document.createElement('div');
                    div.className = "py-3 flex justify-between items-center text-sm";
                    div.innerHTML = `
                        <div>
                            <span class="font-bold text-white text-base">${item.word}</span>
                            <span class="block text-xs text-slate-400">${item.category}</span>
                        </div>
                        <div class="text-right">
                            <span class="font-bold ${colorClass}">${pctText}</span>
                            <span class="block text-xs text-slate-500">${item.correct}/${item.total} correct</span>
                        </div>
                    `;
                    listEl.appendChild(div);
                });
            }

            document.getElementById('stats-modal').classList.remove('hidden');
        }

        function closeStats() {
            document.getElementById('stats-modal').classList.add('hidden');
        }

        window.onload = initGame;
    </script>
</body>
</html>
