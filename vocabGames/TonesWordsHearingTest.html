<!DOCTYPE html>
<html lang="en">
<head>

    <meta property="og:title" content="Where Do The Thai Tones Go? | Thai Learning Game">
    <meta property="og:description" content="A Thai Learning Game For Tone Placement">
    <meta property="og:image" content="https://nerdyguava.github.io/metatags/thai/games/vocab/completeTheTones.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete The Thai Tone Game</title>
    <script src="./assets/vocabAudioUrls.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --wrong: #ef4444;
            --correct: #22c55e;
            --text: #f8fafc;
            --thai-font: "Leelawadee UI", "Tahoma", sans-serif;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Navigation Bar */
        header {
            width: 100%;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #334155;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-btn {
            background: #334155;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn:hover { background: #475569; color: white; }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            padding: 30px;
            border-radius: 24px;
            box-sizing: border-box;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin: 40px auto;
        }

        h1 { font-family: 'Syncopate'; font-size: 1.1rem; color: var(--accent); letter-spacing: 2px; margin-bottom: 15px; }

        /* Filter Controls Styling inside Modal */
        .filter-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid #334155;
        }

        input.filter-input {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 6px 10px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            width: 70px;
            text-align: center;
        }
        input.filter-input::-webkit-inner-spin-button, 
        input.filter-input::-webkit-outer-spin-button { 
            opacity: 1; 
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #334155;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Audio Player Button */
        .audio-btn {
            background: #6366f1;
            border: none;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px auto 5px auto;
            transition: 0.2s;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }
        .audio-btn:hover { background: #4f46e5; transform: scale(1.05); }
        .audio-btn:active { transform: scale(0.95); }

        #word-display {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
            font-family: var(--thai-font);
            font-size: 3.5rem;
            max-width: 100%;
        }

        .char-box {
            border-bottom: 4px solid #334155;
            min-width: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            padding-bottom: 5px;
        }

        .char-box.selected {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-5px);
        }

        .tone-keyboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 20px 0;
        }

        .tone-key {
            background: #334155;
            border: none;
            color: white;
            padding: 15px 5px;
            font-size: 1.6rem;
            border-radius: 12px;
            cursor: pointer;
            font-family: var(--thai-font);
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tone-key:hover { background: #475569; }
        .tone-key:active { transform: scale(0.95); }

        .tone-label {
            font-size: 0.55rem;
            font-family: 'Montserrat', sans-serif;
            color: #94a3b8;
            margin-top: 4px;
            text-transform: uppercase;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-family: 'Syncopate';
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-submit { background: var(--accent); color: #0f172a; }
        .btn-next { background: var(--correct); color: #0f172a; }

        .remove-tone-btn {
            grid-column: span 4;
            font-size: 0.7rem;
            padding: 12px;
            font-family: 'Syncopate';
            background: #1e293b;
            border: 1px dashed #475569;
            color: #94a3b8;
        }
        .remove-tone-btn:hover { background: #334155; color: white; }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .stats-content {
            background: var(--card);
            width: 90%;
            max-width: 450px;
            max-height: 85vh;
            border-radius: 24px;
            padding: 25px;
            overflow-y: auto;
            border: 1px solid #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
            text-align: left;
        }

        .feedback {
            font-weight: 600;
            font-size: 1.1rem; 
            line-height: 1.4;  
            min-height: 30px;
            margin-bottom: 5px;
        }

        .feedback span {
            font-size: 1.3rem;
            font-weight: bold;
            display: inline-block;
            margin-left: 5px;
        }

        @media (max-width: 480px) {
            #word-display {
                font-size: 2.2rem; 
                gap: 8px;
            }
            .char-box {
                min-width: 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <header>
        <a href="https://yournerdythaitutor.github.io/Lessons/" class="nav-btn">
            Study Thai
        </a>
        <div class="nav-group">
            <button onclick="showFilters()" class="nav-btn">
                ⚙️ Filters
            </button>
            <button onclick="showStats()" class="nav-btn">
                📊 Stats 
            </button>
        </div>
    </header>

    <div class="container">
        <h1>COMPLETE THE TONES</h1>
        <div id="feedback" class="feedback"></div>
        
        <!-- Audio Player Button -->
        <button class="audio-btn" onclick="playAudio()" title="Listen to Audio">
            <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
        </button>
        <div style="font-size: 0.75rem; color: #64748b; margin-bottom: 5px;">Tap to Listen</div>

        <div id="word-display"></div>

        <div class="tone-keyboard">
            <button class="tone-key" onclick="applyTone('่')">◌่<span class="tone-label">Low</span></button>
            <button class="tone-key" onclick="applyTone('้')">◌้<span class="tone-label">Falling</span></button>
            <button class="tone-key" onclick="applyTone('๊')">◌๊<span class="tone-label">High</span></button>
            <button class="tone-key" onclick="applyTone('๋')">◌๋<span class="tone-label">Rising</span></button>
            <button class="tone-key remove-tone-btn" onclick="applyTone('')">Remove Mark</button>
        </div>

        <button id="action-btn" class="btn btn-submit" onclick="checkAnswer()">Submit Guess</button>
    </div>

    <!-- Filters Modal Overlay -->
    <div id="filters-overlay" class="overlay">
        <div class="stats-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
                <h2 style="font-family: 'Syncopate'; font-size: 0.9rem; color: var(--accent); margin: 0;">Game Filters</h2>
                <button onclick="document.getElementById('filters-overlay').style.display='none'" style="background:none; border:none; color:#94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
            </div>
            
            <!-- Focus Mode Toggle Switch -->
            <div class="filter-container">
                <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1;">Focus Mode (&lt;90% & Unseen)</span>
                <label class="switch">
                    <input type="checkbox" id="focus-mode-toggle" onchange="toggleFocusMode(this)">
                    <span class="slider"></span>
                </label>
            </div>

            <!-- Word Length Input Field -->
            <div class="filter-container">
                <div style="text-align: left;">
                    <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1; display: block;">Exact Word Length</span>
                    <span style="font-size: 0.65rem; color: #64748b;">Leave blank for any length</span>
                </div>
                <input type="number" id="length-filter-input" class="filter-input" min="1" placeholder="Any" oninput="changeLengthFilter(this)">
            </div>

            <button class="btn btn-submit" style="margin-top:15px;" onclick="document.getElementById('filters-overlay').style.display='none'">Apply & Play</button>
        </div>
    </div>

    <!-- Stats Modal Overlay -->
    <div id="stats-overlay" class="overlay">
        <div class="stats-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
                <h2 style="font-family: 'Syncopate'; font-size: 0.9rem; color: var(--accent); margin: 0;">Mastery Rankings</h2>
                <button onclick="document.getElementById('stats-overlay').style.display='none'" style="background:none; border:none; color:#94a3b8; font-size: 1.2rem; cursor: pointer;">✕</button>
            </div>
            
            <div id="stats-list" style="overflow-y: auto; flex: 1; max-height: 45vh; margin-top: 5px;"></div>
            <button class="btn btn-submit" style="margin-top:15px;" onclick="document.getElementById('stats-overlay').style.display='none'">Back to Game</button>
        </div>
    </div>

<script>
    let vocabulary = [];
    let currentWordObj = null;
    let cleanWordParts = [];
    let userWordParts = [];
    let selectedIndex = 0;
    let isReviewMode = false;
    let currentAudio = null;
    let focusMode = localStorage.getItem('thaiToneFocusMode') === 'true';
    let lengthFilter = localStorage.getItem('thaiToneLengthFilter') || '10';
    
    document.addEventListener("DOMContentLoaded", () => {
        const toggleEl = document.getElementById('focus-mode-toggle');
        if (toggleEl) toggleEl.checked = focusMode;

        const inputEl = document.getElementById('length-filter-input');
        if (inputEl) inputEl.value = lengthFilter;
    });

    const tonesRegex = /[่้๊๋]/g;

    function parseVocabUrls() {
        let raw = typeof vocabAudioUrls !== 'undefined' ? vocabAudioUrls : "";
        let lines = [];
        if (typeof raw === 'string') {
            lines = raw.split(/[\r\n]+/).map(l => l.trim()).filter(l => l.startsWith('http'));
        } else if (Array.isArray(raw)) {
            lines = raw;
        }

        vocabulary = lines.map(url => {
            const parts = url.split('/');
            const filenameWithExt = parts[parts.length - 1] || '';
            const word = decodeURIComponent(filenameWithExt.replace('.mp3', ''));
            const stripped = word.replace(tonesRegex, '');
            return { url, word, stripped };
        }).filter(item => item.word.length > 0);
    }

    function splitThai(w) {
        return w.match(/[\u0E00-\u0E7F][\u0E31\u0E34-\u0E3A\u0E47-\u0E4E]*|[\u0E30-\u0E33\u0E40-\u0E46]/g) || [];
    }

    function initGame() {
        parseVocabUrls();
        if (vocabulary.length === 0) {
            console.error("No valid audio URLs found.");
            return;
        }

        isReviewMode = false;
        const actionBtn = document.getElementById('action-btn');
        actionBtn.innerText = "Submit Guess";
        actionBtn.className = "btn btn-submit";
        actionBtn.onclick = checkAnswer;

        let stats = JSON.parse(localStorage.getItem('thaiToneStats')) || {};
        
        // Apply Length Filter first
        let availablePool = vocabulary;
        if (lengthFilter !== '' && !isNaN(lengthFilter)) {
            const targetLen = parseInt(lengthFilter, 10);
            availablePool = availablePool.filter(item => item.word.length === targetLen);
        }

        // Apply Focus Mode Filter next
        if (focusMode) {
            availablePool = availablePool.filter(item => {
                let stat = stats[item.word];
                if (!stat || stat.total === 0) return true;
                let accuracy = stat.correct / stat.total;
                return accuracy < 0.9;
            });
        }

        // Fallback if filters return empty pool
        if (availablePool.length === 0) {
            availablePool = vocabulary;
        }

        let weightedPool = [];
        availablePool.forEach(item => {
            let stat = stats[item.word];
            let weight = 3;
            if (stat && stat.total > 0) {
                let accuracy = stat.correct / stat.total;
                if (accuracy < 0.4) weight = 8;
                else if (accuracy < 0.7) weight = 5;
                else weight = 1;
            }
            for (let i = 0; i < weight; i++) {
                weightedPool.push(item);
            }
        });

        currentWordObj = weightedPool[Math.floor(Math.random() * weightedPool.length)];
        document.getElementById('feedback').innerText = "";

        cleanWordParts = splitThai(currentWordObj.stripped);
        userWordParts = [...cleanWordParts];
        
        selectedIndex = 0;
        renderWord();
        playAudio();
        updateStatsCounter();
    }

    function playAudio() {
        if (!currentWordObj) return;
        if (currentAudio) {
            currentAudio.pause();
        }
        currentAudio = new Audio(currentWordObj.url);
        currentAudio.play().catch(e => console.log("Audio play prevented:", e));
    }

    function renderWord() {
        const display = document.getElementById('word-display');
        display.innerHTML = "";
        
        userWordParts.forEach((part, i) => {
            const span = document.createElement('div');
            span.className = `char-box ${i === selectedIndex ? 'selected' : ''}`;
            span.innerText = part;
            span.onclick = () => {
                if(!isReviewMode) {
                    selectedIndex = i;
                    renderWord();
                }
            };
            display.appendChild(span);
        });
    }

    function applyTone(mark) {
        if(isReviewMode) return;
        let base = userWordParts[selectedIndex].replace(tonesRegex, '');
        userWordParts[selectedIndex] = base + mark;
        renderWord();
    }

    function checkAnswer() {
        if (!currentWordObj) return;
        isReviewMode = true;
        const userAttempt = userWordParts.join('');
        const isCorrect = userAttempt === currentWordObj.word;
        
        updateStats(currentWordObj.word, isCorrect);

        const fb = document.getElementById('feedback');
        const actionBtn = document.getElementById('action-btn');

        if (isCorrect) {
            fb.innerText = "EXCELLENT! Correct tones.";
            fb.style.color = "var(--correct)";
        } else {
            fb.innerHTML = `INCORRECT. The answer was <span style="font-family:var(--thai-font); color:var(--accent);">${currentWordObj.word}</span>`;
            fb.style.color = "var(--wrong)";
        }

        actionBtn.innerText = "Next Word";
        actionBtn.className = "btn btn-next";
        actionBtn.onclick = initGame;
        updateStatsCounter();
    }

    function updateStats(word, correct) {
        let stats = JSON.parse(localStorage.getItem('thaiToneStats')) || {};
        if (!stats[word]) stats[word] = { correct: 0, total: 0 };
        
        stats[word].total++;
        if (correct) stats[word].correct++;
        
        localStorage.setItem('thaiToneStats', JSON.stringify(stats));
    }

    function updateStatsCounter() {
        let stats = JSON.parse(localStorage.getItem('thaiToneStats')) || {};
        let totalAnswers = Object.values(stats).reduce((acc, curr) => acc + curr.total, 0);
        document.getElementById('total-played-count').innerText = totalAnswers;
    }

    function toggleFocusMode(checkbox) {
        focusMode = checkbox.checked;
        localStorage.setItem('thaiToneFocusMode', focusMode);
        initGame();
    }

    function changeLengthFilter(input) {
        lengthFilter = input.value.trim();
        localStorage.setItem('thaiToneLengthFilter', lengthFilter);
        initGame();
    }

    function showFilters() {
        document.getElementById('filters-overlay').style.display = 'flex';
    }

    function showStats() {
        const stats = JSON.parse(localStorage.getItem('thaiToneStats')) || {};
        const listDiv = document.getElementById('stats-list');
        listDiv.innerHTML = "";

        const sortedStats = Object.entries(stats).map(([word, data]) => ({
            word,
            correct: data.correct,
            total: data.total,
            percent: Math.round((data.correct / data.total) * 100)
        })).sort((a, b) => a.percent - b.percent);

        if (sortedStats.length === 0) {
            listDiv.innerHTML = "<p style='color:#64748b; text-align:center; padding: 20px; font-size: 0.85rem;'>No data yet. Keep playing!</p>";
        }

        sortedStats.forEach(item => {
            const row = document.createElement('div');
            row.className = 'stat-row';
            row.innerHTML = `
                <div>
                    <span style="font-family: var(--thai-font); font-size: 1.25rem; color: white; display: block;">${item.word}</span>
                </div>
                <div style="text-align: right;">
                    <span style="font-weight:bold; font-size: 0.95rem; color: ${item.percent < 60 ? 'var(--wrong)' : item.percent < 80 ? '#fbbf24' : 'var(--correct)'}">${item.percent}%</span>
                    <span style="font-size: 0.65rem; color: #64748b; display: block;">${item.correct}/${item.total} correct</span>
                </div>
            `;
            listDiv.appendChild(row);
        });

        document.getElementById('stats-overlay').style.display = 'flex';
    }

    window.onload = initGame;
</script>
</body>
</html>
