<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Tone Minimal Pairs</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: '#1e293b',
                        cardHover: '#334155',
                        accentPurple: '#8b5cf6',
                        accentHover: '#7c3aed',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- Header (Mobile-Friendly Flex Wrap) -->
    <header class="w-full bg-cardBg border-b border-slate-800 px-4 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20 shadow-md">
        <!-- Left: Streak & Filter Button -->
        <div class="flex items-center space-x-2.5">
            <div class="flex items-center space-x-1.5 bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-full text-xs font-semibold">
                <i class="fa-solid fa-fire text-amber-500"></i>
                <span id="streakCount">0</span>
            </div>

            <!-- Filter Modal Button -->
            <button id="openFilterBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3.5 py-1.5 rounded-full border border-slate-700 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-filter text-purple-400"></i>
                <span id="filterButtonLabel">Filter</span>
            </button>
        </div>

        <!-- Right: Stats & Study Thai -->
        <div class="flex items-center space-x-2">
            <button id="openStatsBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3.5 py-1.5 rounded-full border border-slate-700 transition flex items-center space-x-1.5">
                <i class="fa-solid fa-chart-bar text-purple-400"></i>
                <span>Stats</span>
            </button>
            <a href="https://yournerdythaitutor.github.io/Lessons/index.html" target="_blank" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-3.5 py-1.5 rounded-full transition flex items-center space-x-1.5 shadow-sm">
                <i class="fa-solid fa-book-open"></i>
                <span>Study Thai</span>
            </a>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="flex-1 max-w-xl w-full mx-auto p-4 flex flex-col justify-center items-center">
        
        <!-- Loading / Error State -->
        <div id="statusMessage" class="text-center py-12">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-purple-500 mb-3"></i>
            <p class="text-slate-400 text-sm">Loading audio URLs from ./assets/vocabAudioUrls.js...</p>
        </div>

        <!-- Game Card (Hidden until loaded) -->
        <div id="gameCard" class="w-full bg-cardBg border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col items-center hidden relative">
            
            <!-- Audio Player Circle -->
            <div class="my-6 flex flex-col items-center">
                <button id="playAudioBtn" class="w-24 h-24 rounded-full bg-gradient-to-tr from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 flex items-center justify-center text-white text-3xl shadow-lg transform active:scale-95 transition focus:outline-none ring-4 ring-purple-500/20">
                    <i class="fa-solid fa-volume-high" id="audioIcon"></i>
                </button>
                <p class="text-xs text-slate-400 mt-3 font-medium">Tap to listen to the tone audio</p>
                <!-- Only shown if user interacts and browser blocks -->
                <p id="audioErrorMsg" class="text-xs text-rose-400 mt-1 hidden font-medium">Audio playback blocked or failed. Click Next to continue.</p>
            </div>

            <!-- Feedback / Next Area -->
            <div id="feedbackContainer" class="w-full min-h-[3rem] my-2 flex items-center justify-center text-center">
                <!-- Will display green/red text or Next button dynamically -->
            </div>

            <!-- Multiple Choice Options Container -->
            <div id="optionsContainer" class="w-full grid grid-cols-1 gap-3 mt-4">
                <!-- Dynamically populated buttons -->
            </div>

        </div>
    </main>

    <!-- Filter Modal -->
    <div id="filterModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-slate-800 rounded-2xl w-full max-w-sm p-6 shadow-2xl flex flex-col">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <h2 class="text-base font-bold text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-filter text-purple-400"></i>
                    <span>Filter Words</span>
                </h2>
                <button id="closeFilterModalBtn" class="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="py-4 space-y-2.5">
                <label class="flex items-center space-x-3 p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl border border-slate-700/50 cursor-pointer transition">
                    <input type="radio" name="filterOption" value="all" checked class="text-purple-600 focus:ring-purple-500 h-4 w-4">
                    <span class="text-sm font-medium text-slate-200">All Words</span>
                </label>
                <label class="flex items-center space-x-3 p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl border border-slate-700/50 cursor-pointer transition">
                    <input type="radio" name="filterOption" value="unseen" class="text-purple-600 focus:ring-purple-500 h-4 w-4">
                    <span class="text-sm font-medium text-slate-200">Unseen Words Only</span>
                </label>
                <label class="flex items-center space-x-3 p-3 bg-slate-800/50 hover:bg-slate-800 rounded-xl border border-slate-700/50 cursor-pointer transition">
                    <input type="radio" name="filterOption" value="needsPractice" class="text-purple-600 focus:ring-purple-500 h-4 w-4">
                    <span class="text-sm font-medium text-slate-200">Needs Practice (&lt;90%)</span>
                </label>
            </div>

            <div class="pt-3 border-t border-slate-800 flex justify-end">
                <button id="applyFilterBtn" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-4 py-2 rounded-xl transition">
                    Apply Filter
                </button>
            </div>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="statsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-cardBg border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between pb-4 border-b border-slate-800">
                <h2 class="text-lg font-bold text-slate-100 flex items-center space-x-2">
                    <i class="fa-solid fa-chart-pie text-purple-400"></i>
                    <span>Your Tone Statistics</span>
                </h2>
                <button id="closeStatsBtn" class="text-slate-400 hover:text-slate-200 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div class="py-4 grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
                <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                    <span class="block text-[11px] text-slate-400">Seen</span>
                    <span id="statTotalSeen" class="text-base font-bold text-slate-100">0</span>
                </div>
                <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                    <span class="block text-[11px] text-slate-400">Mastered</span>
                    <span id="statMastered" class="text-base font-bold text-emerald-400">0</span>
                </div>
                <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                    <span class="block text-[11px] text-slate-400">Best Streak</span>
                    <span id="statBestStreak" class="text-base font-bold text-amber-400">0</span>
                </div>
                <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                    <span class="block text-[11px] text-slate-400">Accuracy</span>
                    <span id="statAccuracy" class="text-base font-bold text-purple-400">0%</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto mt-2 space-y-2 pr-1" id="statsListContainer">
                <!-- Word list stats populated here -->
            </div>

            <div class="pt-4 border-t border-slate-800 flex justify-between items-center mt-3">
                <button id="resetStatsBtn" class="text-xs text-rose-400 hover:text-rose-300 font-medium px-3 py-1.5 rounded-lg border border-rose-500/20 bg-rose-500/10 transition">
                    Reset Progress
                </button>
                <button id="closeStatsModalBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2 rounded-xl transition">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript: Core App Logic -->
    <script>
        let allWordsData = []; 
        let minimalPairsGroups = {}; 
        let currentPairGroup = null;
        let targetItem = null;
        let streak = parseInt(localStorage.getItem('thai_tone_streak') || '0', 10);
        let bestStreak = parseInt(localStorage.getItem('thai_tone_best_streak') || streak.toString(), 10);
        let userStats = JSON.parse(localStorage.getItem('thai_tone_stats') || '{}');
        let currentFilter = 'all';
        let answeredCurrent = false;

        document.getElementById('streakCount').textContent = streak;
        if (streak > bestStreak) {
            bestStreak = streak;
            localStorage.setItem('thai_tone_best_streak', bestStreak);
        }

        function stripThaiTones(word) {
            return word.replace(/[\u0E48-\u0E4D]/g, '');
        }

        async function loadVocabAudioScript() {
            try {
                const response = await fetch('./assets/vocabAudioUrls.js');
                if (!response.ok) throw new Error("Failed to load ./assets/vocabAudioUrls.js");
                const scriptText = await response.text();

                const urlMatches = scriptText.match(/https?:\/\/[^\s"'`]+\.mp3/g);
                if (!urlMatches || urlMatches.length === 0) {
                    throw new Error("No valid MP3 URLs found in script file.");
                }

                processLoadedUrls(urlMatches);
            } catch (err) {
                console.error(err);
                document.getElementById('statusMessage').innerHTML = `
                    <i class="fa-solid fa-triangle-exclamation text-3xl text-rose-500 mb-3"></i>
                    <p class="text-rose-400 text-sm font-semibold">Failed to load audio files. Please check ./assets/vocabAudioUrls.js</p>
                `;
            }
        }

        function processLoadedUrls(urls) {
            allWordsData = [];
            urls.forEach(url => {
                const parts = url.split('/');
                const rawFilename = parts[parts.length - 1];
                const word = decodeURIComponent(rawFilename.replace('.mp3', '').trim());
                if (word) {
                    const baseKey = stripThaiTones(word);
                    allWordsData.push({ word, baseKey, url });
                }
            });

            const groups = {};
            allWordsData.forEach(item => {
                if (!groups[item.baseKey]) groups[item.baseKey] = [];
                if (!groups[item.baseKey].some(i => i.word === item.word)) {
                    groups[item.baseKey].push(item);
                }
            });

            minimalPairsGroups = {};
            Object.keys(groups).forEach(key => {
                if (groups[key].length >= 2) {
                    minimalPairsGroups[key] = groups[key];
                }
            });

            if (Object.keys(minimalPairsGroups).length === 0) {
                document.getElementById('statusMessage').innerHTML = `
                    <i class="fa-solid fa-circle-exclamation text-3xl text-amber-500 mb-3"></i>
                    <p class="text-amber-400 text-sm font-semibold">No minimal tone pairs found in the provided URLs.</p>
                `;
                return;
            }

            document.getElementById('statusMessage').classList.add('hidden');
            document.getElementById('gameCard').classList.remove('hidden');

            nextRound();
        }

        function getFilteredGroups() {
            const keys = Object.keys(minimalPairsGroups);
            return keys.filter(key => {
                const groupItems = minimalPairsGroups[key];
                if (currentFilter === 'all') return true;

                if (currentFilter === 'unseen') {
                    return groupItems.every(item => !userStats[item.word] || userStats[item.word].attempts === 0);
                }

                if (currentFilter === 'needsPractice') {
                    return groupItems.some(item => {
                        const stat = userStats[item.word];
                        if (!stat || stat.attempts === 0) return false;
                        const acc = (stat.correct / stat.attempts) * 100;
                        return acc < 90;
                    });
                }
                return true;
            });
        }

        function nextRound() {
            answeredCurrent = false;
            document.getElementById('audioErrorMsg').classList.add('hidden');
            
            const eligibleKeys = getFilteredGroups();
            if (eligibleKeys.length === 0) {
                document.getElementById('feedbackContainer').innerHTML = `
                    <p class="text-amber-400 text-sm font-medium">No words match the current filter! Switch filter to 'All Eligible'.</p>
                `;
                document.getElementById('optionsContainer').innerHTML = '';
                return;
            }

            const randomKey = eligibleKeys[Math.floor(Math.random() * eligibleKeys.length)];
            currentPairGroup = minimalPairsGroups[randomKey];
            targetItem = currentPairGroup[Math.floor(Math.random() * currentPairGroup.length)];

            playTargetAudio();
            renderOptions();
        }

        let currentGameAudio = null;
        function playTargetAudio(isExplicitClick = false) {
            if (!targetItem) return;
            console.log("Playing audio for [Word]:", targetItem.url);

            if (currentGameAudio) {
                currentGameAudio.pause();
                currentGameAudio = null;
            }

            currentGameAudio = new Audio(targetItem.url);
            currentGameAudio.play().catch(err => {
                console.warn("Audio autoplay blocked:", err);
                if (isExplicitClick) {
                    document.getElementById('audioErrorMsg').classList.remove('hidden');
                }
            });
        }

        document.getElementById('playAudioBtn').addEventListener('click', () => {
            playTargetAudio(true);
        });

        function renderOptions() {
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            document.getElementById('feedbackContainer').innerHTML = '';

            const shuffledOptions = [...currentPairGroup].sort(() => Math.random() - 0.5);

            shuffledOptions.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "w-full py-3.5 px-4 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 rounded-xl text-lg font-medium text-slate-100 transition transform active:scale-[0.99] flex items-center justify-center shadow-sm";
                btn.textContent = item.word;
                btn.onclick = () => handleAnswer(item, btn);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedItem, btnElement) {
            if (answeredCurrent) return;
            answeredCurrent = true;

            const isCorrect = (selectedItem.word === targetItem.word);

            if (!userStats[targetItem.word]) {
                userStats[targetItem.word] = { attempts: 0, correct: 0 };
            }
            userStats[targetItem.word].attempts++;
            if (isCorrect) {
                userStats[targetItem.word].correct++;
                streak++;
                if (streak > bestStreak) {
                    bestStreak = streak;
                    localStorage.setItem('thai_tone_best_streak', bestStreak);
                }
            } else {
                streak = 0;
            }
            localStorage.setItem('thai_tone_streak', streak);
            localStorage.setItem('thai_tone_stats', JSON.stringify(userStats));
            document.getElementById('streakCount').textContent = streak;

            const allButtons = document.getElementById('optionsContainer').children;
            for (let b of allButtons) {
                b.disabled = true;
                if (b.textContent === targetItem.word) {
                    b.classList.remove('bg-slate-800/80', 'border-slate-700/60');
                    b.classList.add('bg-emerald-600/30', 'border-emerald-500', 'text-emerald-300');
                } else if (b === btnElement && !isCorrect) {
                    b.classList.remove('bg-slate-800/80', 'border-slate-700/60');
                    b.classList.add('bg-rose-600/30', 'border-rose-500', 'text-rose-300');
                }
            }

            const feedbackContainer = document.getElementById('feedbackContainer');
            feedbackContainer.innerHTML = `
                <div class="flex items-center justify-between w-full px-2 animate-fadeIn">
                    <span class="text-sm font-bold ${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">
                        ${isCorrect ? 'Correct!' : `Incorrect! Correct word: ${targetItem.word}`}
                    </span>
                    <button id="nextRoundBtn" class="bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold px-5 py-2 rounded-xl transition shadow-md flex items-center space-x-1.5">
                        <span>Next</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            `;

            document.getElementById('nextRoundBtn').onclick = () => {
                nextRound();
            };
        }

        // Filter Modal Logic
        const filterModal = document.getElementById('filterModal');
        document.getElementById('openFilterBtn').addEventListener('click', () => filterModal.classList.remove('hidden'));
        document.getElementById('closeFilterModalBtn').addEventListener('click', () => filterModal.classList.add('hidden'));
        filterModal.addEventListener('click', (e) => {
            if (e.target === filterModal) filterModal.classList.add('hidden');
        });

        document.getElementById('applyFilterBtn').addEventListener('click', () => {
            const selectedRadio = document.querySelector('input[name="filterOption"]:checked');
            if (selectedRadio) {
                currentFilter = selectedRadio.value;
                const labels = {
                    all: 'Filter',
                    unseen: 'Unseen',
                    needsPractice: 'Needs Practice'
                };
                document.getElementById('filterButtonLabel').textContent = labels[currentFilter];
            }
            filterModal.classList.add('hidden');
            nextRound();
        });

        // Stats Modal Logic
        const statsModal = document.getElementById('statsModal');
        document.getElementById('openStatsBtn').addEventListener('click', () => {
            updateStatsModalContent();
            statsModal.classList.remove('hidden');
        });
        document.getElementById('closeStatsBtn').addEventListener('click', () => statsModal.classList.add('hidden'));
        document.getElementById('closeStatsModalBtn').addEventListener('click', () => statsModal.classList.add('hidden'));
        statsModal.addEventListener('click', (e) => {
            if (e.target === statsModal) statsModal.classList.add('hidden');
        });

        function updateStatsModalContent() {
            let totalSeen = 0;
            let totalAttempts = 0;
            let totalCorrect = 0;
            let masteredCount = 0;

            let attemptedItems = [];
            allWordsData.forEach(item => {
                const stat = userStats[item.word];
                if (stat && stat.attempts > 0) {
                    totalSeen++;
                    totalAttempts += stat.attempts;
                    totalCorrect += stat.correct;
                    const acc = (stat.correct / stat.attempts) * 100;
                    
                    if (stat.attempts >= 10 && acc >= 90) {
                        masteredCount++;
                    }

                    attemptedItems.push({ word: item.word, correct: stat.correct, attempts: stat.attempts, acc });
                }
            });

            // Sort by lowest correct percentage at the top
            attemptedItems.sort((a, b) => a.acc - b.acc);

            const listContainer = document.getElementById('statsListContainer');
            listContainer.innerHTML = '';

            attemptedItems.forEach(item => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-slate-800/40 px-3 py-2 rounded-xl border border-slate-700/40 text-xs";
                row.innerHTML = `
                    <span class="font-medium text-slate-200">${item.word}</span>
                    <div class="flex items-center space-x-3 text-slate-400">
                        <span>${item.correct}/${item.attempts}</span>
                        <span class="font-semibold ${item.acc >= 90 ? 'text-emerald-400' : item.acc >= 70 ? 'text-amber-400' : 'text-rose-400'}">${item.acc.toFixed(0)}%</span>
                    </div>
                `;
                listContainer.appendChild(row);
            });

            if (totalSeen === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-500 text-xs py-6">No words attempted yet. Start playing to track progress!</p>`;
            }

            document.getElementById('statTotalSeen').textContent = totalSeen;
            document.getElementById('statMastered').textContent = masteredCount;
            document.getElementById('statBestStreak').textContent = bestStreak;
            const overallAcc = totalAttempts > 0 ? ((totalCorrect / totalAttempts) * 100).toFixed(0) + '%' : '0%';
            document.getElementById('statAccuracy').textContent = overallAcc;
        }

        document.getElementById('resetStatsBtn').addEventListener('click', () => {
            if (confirm("Are you sure you want to reset all your statistics and progress?")) {
                userStats = {};
                streak = 0;
                bestStreak = 0;
                localStorage.removeItem('thai_tone_stats');
                localStorage.setItem('thai_tone_streak', '0');
                localStorage.setItem('thai_tone_best_streak', '0');
                document.getElementById('streakCount').textContent = '0';
                updateStatsModalContent();
                nextRound();
            }
        });

        // Initialize on load
        loadVocabAudioScript();
    </script>
</body>
</html>
