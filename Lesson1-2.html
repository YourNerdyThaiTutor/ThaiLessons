    <body>

        <div id="score" class="score">Score: </div>

        <div id="question" class="question">

        <div id="answers" class="answers">

        </div>

        <!-- Stats Popup Modal -->
        <div id="statsOverlay" class="stats-overlay" onclick="toggleStats()"></div>
        <div id="statsModal" class="stats-modal">
            <div style="display: flex; justify-content: space-between; align-items: center;">

            <div class="stats-table-container">

                        <tr>
                            <th>Name</th>

                                <span onclick="toggleProgressInfo()" style="cursor: pointer; font-size: 13px; margin-left: 4px;" title="Click for info">ℹ️</span>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="statsTableBody">
                        <!-- Populated dynamically via JS -->
                    </tbody>
                </table>
            </div>
            <div style="text-align: center;">
                <button class="stats-close-btn" onclick="toggleStats()">Close</button>
            </div>
        </div>

        <!-- Progress Colors Info Modal -->
        <div id="progressInfoOverlay" class="stats-overlay" onclick="toggleProgressInfo()" style="z-index: 1001;"></div>
        <div id="progressInfoModal" class="stats-modal" style="z-index: 1002; max-width: 400px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: #2d6a4f;">Progress Colors</h3>
                <span onclick="toggleProgressInfo()" style="cursor: pointer; font-size: 22px; font-weight: bold; color: #666;">&times;</span>
            </div>
            <div style="text-align: left; font-size: 14px; line-height: 1.6; margin-top: 15px;">
                <p><b>0-9 Streak:</b> <span style="color: #ff0000; font-weight: bold;">Red</span> — Low progress</p>
                <p><b>10-24 Streak:</b> <span style="color: #ff8000; font-weight: bold;">Orange</span> — Decent Progress</p>
                <p><b>25-49 Streak:</b> <span style="color: #cc9900; font-weight: bold;">Yellow</span> — Good progress</p>
                <p><b>50-99 Streak:</b> <span style="color: #77dd77; font-weight: bold;">Green</span> — Great progress</p>
                <p><b>100 Streak:</b> 👑 — Perfect mastery</p>
            </div>
            <div style="text-align: center;">
                <button class="stats-close-btn" onclick="toggleProgressInfo()">Close</button>
            </div>
        </div>

        <script>
            var consonants =["ก","จ","ด","ต","บ","ป","อ"]; //middle consonants
            var single_low_consonants = ["ง","ญ","น","ย","ณ","ร","ว","ม","ฬ","ล"];
            var paired_low_consonants = ["ค","ช","ซ","ท","พ","ฟ","ฮ"];//simple consonants no repeeated sounds
            var paired_high_consonants = ["ข","ฉ","ส","ถ","ผ","ฝ","ห"];
            var tones =["","่","้","๊","๋"];
            var vowels =["า","อ"];
            var choices = consonants;
            var correct ="";
            var score = 0;
            var alreadyWrong = false;
            var streak = 0;

            var gameKey = "Lesson1-2"; // Matches your AllGames row ID key

            // Load itemized tracking maps from localStorage (or initialize empty objects)
            var attemptsMap = JSON.parse(localStorage.getItem(gameKey + "_attempts") || "{}");
            var correctMap = JSON.parse(localStorage.getItem(gameKey + "_correct") || "{}");
            var streakMap = JSON.parse(localStorage.getItem(gameKey + "_streaks") || "{}");
            var globalBestStreak = Number(localStorage.getItem(gameKey + "Streak") || 0); // All-time overall game streak
            var currentStreakMap = {}; // Tracks live active streak per letter during session

            var input = document.getElementById("numb");
                input.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        event.preventDefault();
                        document.getElementById("myBtn").click();
                    }
                });

            function checkAnswer(txt){

                // Initialize stats for this letter if not present
                if(!attemptsMap[correct]) attemptsMap[correct] = 0;
                if(!correctMap[correct]) correctMap[correct] = 0;
                if(!streakMap[correct]) streakMap[correct] = 0;
                if(!currentStreakMap[correct]) currentStreakMap[correct] = 0;
                
                
                if(txt === correct){
                    //var t = document.createTextNode("correct");
                    //document.body.appendChild(t);
                    document.getElementById("myBtn").style.background='#00ff00';
                    
                    if(!alreadyWrong){
                        score ++;
                        streak ++;

                        attemptsMap[correct]++;
                        correctMap[correct]++;
                        currentStreakMap[correct]++;

                        // 1. Update individual letter streak
                        if(currentStreakMap[correct] > streakMap[correct]) {
                            streakMap[correct] = currentStreakMap[correct];
                        }

                        // 2. Update overall all-time game streak
                        if(streak > globalBestStreak) {
                            globalBestStreak = streak;
                        }

                        // Save cleanly as "Lesson1-2Streak" for your AllGames progress bar and stats summary
                        localStorage.setItem(gameKey + "Streak", globalBestStreak);

                        // Save itemized letter stats
                        localStorage.setItem(gameKey + "_attempts", JSON.stringify(attemptsMap));
                        localStorage.setItem(gameKey + "_correct", JSON.stringify(correctMap));
                        localStorage.setItem(gameKey + "_streaks", JSON.stringify(streakMap));

                        
                        document.getElementById("score").textContent = "Score: "+score;
                        document.getElementById("streak").textContent = "Streak: "+streak;
                    }
                    else{
                        streak = 0;
                        currentStreakMap[correct] = 0;
                        document.getElementById("streak").textContent = "Streak: "+streak;
                    }
                    alreadyWrong = false;

                    //check if helper table is open
                    var helperTable = document.getElementById("etable");
                    helperTable.style.display = "none";
                    document.getElementById("helper").innerHTML = "click here to see where the letter is";

                    setTimeout(() => startGame(),700);
                    
                }
                else{
                    //var ti = document.createTextNode("wrong");
                    //document.body.appendChild(ti);
                    document.getElementById("myBtn").style.background='#ff3333';

                    // If this is the FIRST time missing it on this question, log an attempt
                    if(!alreadyWrong) {
                        attemptsMap[correct]++;
                        localStorage.setItem(gameKey + "_attempts", JSON.stringify(attemptsMap));
                    }

                    alreadyWrong = true;
                    currentStreakMap[correct] = 0;

                }
            }
            function createQuestion(){
                var correctIndex = Math.floor(Math.random() * choices.length);
                correct = choices[correctIndex];
                var src = "mid/"+correct+"อ"+".mp3";
                
                var audio = document.getElementById('audio');

                var source = document.getElementById('audioSource');
                source.src = src;
                audio.load();
                audio.play();
                //var t = document.createTextNode(src);
                //document.body.appendChild(t);
            }

            function SubmitAnswer() {
            // Get the value of the input field with id="numb"
            let x = document.getElementById("numb").value;
                document.getElementById("numb").focus();
                document.getElementById("numb").select();
            // If x is Not a Number or less than one or greater than 10
            x.replace(/\s/g, '');
            checkAnswer(x);
            }

            function startGame(){
                document.getElementById("numb").focus();
                document.getElementById("numb").select();
                document.getElementById("myBtn").style.background='#ffffff';
                createQuestion();
            }

            window.onload = function start(){startGame();}

            function toggleHelp(){
                
                //TODO show ending consonant table
                var x = document.getElementById("etable");
                var letters = "";
                for(let i = 0; i< correct.length;i++){
                    letters+=correct[i]+",";
                }
                x.src = "https://yournerdythaitutor.github.io/ThaiKeyboard.html?product="+letters;
                if (x.style.display === "none") {
                    x.style.display = "block";
                    document.getElementById("helper").innerHTML = "close table";
                } else {
                    x.style.display = "none";
                    document.getElementById("helper").innerHTML = "click here to see where the letter is";
                }
            }

            function toggleStats() {
                var modal = document.getElementById("statsModal");
                var overlay = document.getElementById("statsOverlay");
                
                if (modal.style.display === "block") {
                    modal.style.display = "none";
                    overlay.style.display = "none";
                } else {
                    buildStatsTable();
                    modal.style.display = "block";
                    overlay.style.display = "block";
                }
            }

            function buildStatsTable() {
                var tbody = document.getElementById("statsTableBody");
                tbody.innerHTML = "";

                // 1. Calculate Overall Totals for the Top Summary Row
                var totalAttemptsAll = 0;
                var totalCorrectAll = 0;

                consonants.forEach(function(item) {
                    totalAttemptsAll += (attemptsMap[item] || 0);
                    totalCorrectAll += (correctMap[item] || 0);
                });

                // Use all-time overall game streak for the top row
                var maxStreakAll = Number(localStorage.getItem(gameKey + "Streak") || globalBestStreak);
                var overallRate = totalAttemptsAll > 0 ? (totalCorrectAll / totalAttemptsAll) * 100 : 0;
                
                // Render Overall Summary Row at the Top
                var overallTr = document.createElement("tr");
                overallTr.className = "overall-row";

                var tdNameAll = document.createElement("td");
                tdNameAll.textContent = gameKey; // Displays "Lesson1-2"
                overallTr.appendChild(tdNameAll);

                var tdRateAll = document.createElement("td");
                tdRateAll.textContent = overallRate.toFixed(2) + "%";
                overallTr.appendChild(tdRateAll);

                var tdStreakAll = document.createElement("td");
                tdStreakAll.textContent = maxStreakAll;
                overallTr.appendChild(tdStreakAll);

                var tdProgressAll = document.createElement("td");
                tdProgressAll.appendChild(createMiniProgressBar(maxStreakAll, 100));
                overallTr.appendChild(tdProgressAll);

                tbody.appendChild(overallTr);

                // 2. Prepare individual consonant rows for sorting
                var rowsData = consonants.map(function(item) {
                    var att = attemptsMap[item] || 0;
                    var cor = correctMap[item] || 0;
                    var rate = att > 0 ? (cor / att) : 0; 
                    var strk = streakMap[item] || 0;
                    return { name: item, rate: rate, streak: strk, attempts: att };
                });

                // Sort by worst success rate top-to-bottom (lowest percentage first)
                rowsData.sort(function(a, b) {
                    if (a.rate !== b.rate) {
                        return a.rate - b.rate; 
                    }
                    return b.attempts - a.attempts;
                });

                // Render individual item rows
                rowsData.forEach(function(data) {
                    var tr = document.createElement("tr");

                    var tdName = document.createElement("td");
                    tdName.textContent = data.name;
                    tr.appendChild(tdName);

                    var tdRate = document.createElement("td");
                    var actualCorrect = correctMap[data.name] || 0;
                    var actualAttempts = attemptsMap[data.name] || 0;
                    var exactRate = actualAttempts > 0 ? (actualCorrect / actualAttempts) * 100 : 0;
                    tdRate.textContent = exactRate.toFixed(2) + "%";
                    tr.appendChild(tdRate);

                    var tdStreak = document.createElement("td");
                    tdStreak.textContent = data.streak;
                    tr.appendChild(tdStreak);

                    var tdProgress = document.createElement("td");
                    tdProgress.appendChild(createMiniProgressBar(data.streak, 20));
                    tr.appendChild(tdProgress);

                    tbody.appendChild(tr);
                });
            }

            function createMiniProgressBar(streakVal, goalVal) {
                var container = document.createElement("div");
                container.style.display = "flex";
                container.style.alignItems = "center";
                container.style.gap = "6px";

                var barContainer = document.createElement("div");
                barContainer.style.width = "80px";
                barContainer.style.backgroundColor = "#eee";
                barContainer.style.borderRadius = "4px";
                barContainer.style.height = "12px";
                barContainer.style.overflow = "hidden";

                var barFill = document.createElement("div");
                var fillPercent = Math.min((streakVal / goalVal) * 100, 100);
                barFill.style.width = fillPercent + "%";
                barFill.style.height = "100%";

                // Match exact color switch thresholds from your AllGames progress bar logic
                let barColor;
                switch (true) {
                    case (streakVal < 10):
                        barColor = "#ff0000"; // Red
                        break;
                    case (streakVal < 25):
                        barColor = "#ff8000"; // Orange
                        break;
                    case (streakVal < 50):
                        barColor = "#ffcc00"; // Yellow
                        break;
                    case (streakVal < 100):
                        barColor = "#77dd77"; // Green
                        break;
                    default:
                        barColor = "#77dd77";
                        break;
                }
                barFill.style.backgroundColor = barColor;
                barContainer.appendChild(barFill);
                container.appendChild(barContainer);

                // Append crown if streak reaches 100 (matching your main table behavior)
                if (streakVal >= 100) {
                    var crownSpan = document.createElement("span");
                    crownSpan.textContent = "👑";
                    crownSpan.style.fontSize = "14px";
                    container.appendChild(crownSpan);
                }

                return container;
            }

            function toggleProgressInfo() {
                var modal = document.getElementById("progressInfoModal");
                var overlay = document.getElementById("progressInfoOverlay");
                
                if (modal.style.display === "block") {
                    modal.style.display = "none";
                    overlay.style.display = "none";
                } else {
                    modal.style.display = "block";
                    overlay.style.display = "block";
                }
            }

        </script>
